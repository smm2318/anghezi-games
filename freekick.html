<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی‌های انقزی 🎮</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:white;

    background:
    radial-gradient(
        circle at top,
        #15558a,
        #071522 45%,
        #02060b
    );

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}

.container{
    width:94%;
    max-width:1100px;
    padding:30px 15px;
}

.header{
    text-align:center;
    margin-bottom:35px;
}

.header h1{
    margin:0;
    font-size:44px;
    text-shadow:0 5px 20px rgba(0,0,0,.5);
}

.header p{
    margin-top:12px;
    opacity:.75;
    font-size:17px;
}

.games{
    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(270px,1fr)
    );

    gap:25px;
}

.game-card{
    overflow:hidden;

    border-radius:25px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.18);

    box-shadow:
    0 20px 50px rgba(0,0,0,.45);

    cursor:pointer;

    transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.game-card:hover{
    transform:
    translateY(-9px)
    scale(1.02);

    box-shadow:
    0 30px 70px rgba(0,0,0,.65);
}

.game-image{
    width:100%;
    height:220px;

    object-fit:cover;

    display:block;
}

.card-info{
    text-align:center;
    padding:18px;
}

.card-info h2{
    margin:0 0 8px;
    font-size:24px;
}

.card-info p{
    margin:0;
    opacity:.7;
    font-size:15px;
}

.play-button{
    display:inline-block;

    margin-top:15px;

    padding:11px 27px;

    border-radius:13px;

    background:#16a34a;

    color:white;

    font-weight:bold;

    box-shadow:
    0 5px 15px rgba(22,163,74,.25);
}

.locked{
    opacity:.45;
    cursor:not-allowed;
}

.locked:hover{
    transform:none;
}

.future-icon{
    height:220px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:80px;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.02)
    );
}

.footer{
    text-align:center;

    margin-top:35px;

    opacity:.45;

    font-size:13px;
}

@media(max-width:600px){

    .header h1{
        font-size:32px;
    }

    .header p{
        font-size:15px;
    }

    .game-image,
    .future-icon{
        height:190px;
    }

    .card-info h2{
        font-size:21px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- عنوان -->

<div class="header">

<h1>
🎮 بازی‌های انقزی
</h1>

<p>
بازی‌های کوچک و سرگرم‌کننده انقزی ⚽🔥
</p>

</div>


<div class="games">


<!-- ========================= -->
<!-- پنالتی -->
<!-- ========================= -->

<div
class="game-card"
onclick="openPenalty()"
>

<img
src="./penalty.jpg"
class="game-image"
alt="پنالتی انقزی"
>

<div class="card-info">

<h2>
⚽ پنالتی انقزی
</h2>

<p>
توپ را بکش و شوت کن!
</p>

<span class="play-button">
▶ بازی کن
</span>

</div>

</div>


<!-- ========================= -->
<!-- ضربه آزاد -->
<!-- ========================= -->

<div
class="game-card"
onclick="openFreeKick()"
>

<img
src="./freekick.jpg"
class="game-image"
alt="ضربه آزاد انقزی"
>

<div class="card-info">

<h2>
🎯 ضربه آزاد انقزی
</h2>

<p>
از روی دیوار دفاعی گل بزن!
</p>

<span class="play-button">
▶ بازی کن
</span>

</div>

</div>


<!-- ========================= -->
<!-- بازی آینده -->
<!-- ========================= -->

<div class="game-card locked">

<div class="future-icon">
🧠
</div>

<div class="card-info">

<h2>
حدس بازیکن
</h2>

<p>
به‌زودی...
</p>

</div>

</div>


<!-- ========================= -->
<!-- بازی آینده -->
<!-- ========================= -->

<div class="game-card locked">

<div class="future-icon">
🏎️
</div>

<div class="card-info">

<h2>
مسابقه فوتبال
</h2>

<p>
به‌زودی...
</p>

</div>

</div>


</div>


<div class="footer">

⚽ ساخته شده برای بازی‌های انقزی

</div>


</div>


<script>

/* ورود به پنالتی */

function openPenalty(){

    window.location.href =
    "./penalty.html";

}


/* ورود به ضربه آزاد */

function openFreeKick(){

    window.location.href =
    "./freekick.html";

}

</script>


</body>

</html>
