<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>حدس بازیکن انقزی 🧠⚽</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:white;

    background:
    radial-gradient(
        circle at top,
        #174b7a,
        #071522 48%,
        #02060b
    );

    display:flex;

    justify-content:center;

    align-items:center;
}

.game{

    width:95%;

    max-width:900px;

    padding:20px;

    border-radius:28px;

    background:
    rgba(0,0,0,.48);

    box-shadow:
    0 25px 70px
    rgba(0,0,0,.65);
}


/* HEADER */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:15px;
}

.header h1{

    margin:0;

    font-size:29px;
}

.stats{

    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.stat{

    padding:
    9px 13px;

    border-radius:12px;

    background:
    rgba(255,255,255,.09);

    font-size:14px;
}


/* PROGRESS */

.progress{

    height:8px;

    background:
    rgba(255,255,255,.1);

    border-radius:20px;

    overflow:hidden;

    margin-bottom:18px;
}

.progress-bar{

    height:100%;

    width:0%;

    background:
    linear-gradient(
        90deg,
        #22c55e,
        #38bdf8
    );

    transition:.35s;
}


/* PLAYER CARD */

.player-card{

    position:relative;

    min-height:410px;

    overflow:hidden;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        #172554,
        #0f172a
    );

    border:
    1px solid
    rgba(255,255,255,.15);

    display:flex;

    justify-content:flex-end;

    align-items:center;

    flex-direction:column;

    padding:20px;

    margin-bottom:20px;
}

.player-card::before{

    content:"⚽";

    position:absolute;

    font-size:190px;

    opacity:.035;

    top:20px;

    left:25px;

    transform:rotate(-20deg);
}

.question{

    position:absolute;

    top:20px;

    left:10px;

    right:10px;

    text-align:center;

    font-size:21px;

    font-weight:bold;

    z-index:5;
}


/* SVG */

#playerSVG{

    width:270px;

    height:320px;

    z-index:2;

    filter:
    drop-shadow(
        0 15px 15px
        rgba(0,0,0,.35)
    );
}


/* OPTIONS */

.options{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;
}

.option{

    border:0;

    padding:16px;

    border-radius:15px;

    background:
    rgba(255,255,255,.09);

    color:white;

    font-family:inherit;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    border:
    1px solid
    rgba(255,255,255,.1);

    transition:.2s;
}

.option:hover{

    background:
    rgba(255,255,255,.17);

    transform:
    translateY(-2px);
}

.option.correct{

    background:#15803d;

    border-color:#4ade80;
}

.option.wrong{

    background:#991b1b;

    border-color:#f87171;
}

.option:disabled{

    cursor:default;
}


/* MESSAGE */

#message{

    min-height:35px;

    margin-top:15px;

    text-align:center;

    font-size:19px;

    font-weight:bold;
}


/* NEXT */

#next{

    display:none;

    margin:
    12px auto 0;

    padding:
    12px 30px;

    border:0;

    border-radius:14px;

    background:#2563eb;

    color:white;

    font-family:inherit;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}


/* RESULT */

#result{

    display:none;

    text-align:center;

    padding:30px 10px;
}

#result h2{

    font-size:35px;
}

.restart{

    border:0;

    padding:
    14px 30px;

    border-radius:14px;

    background:#16a34a;

    color:white;

    font-family:inherit;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.back{

    display:block;

    text-align:center;

    margin-top:18px;

    color:#93c5fd;

    text-decoration:none;
}


/* MOBILE */

@media(max-width:600px){

    .header{

        flex-direction:column;

        align-items:stretch;
    }

    .header h1{

        text-align:center;

        font-size:24px;
    }

    .stats{

        justify-content:center;
    }

    .options{

        grid-template-columns:1fr;
    }

    .player-card{

        min-height:360px;
    }

    #playerSVG{

        width:230px;

        height:280px;
    }

}

</style>

</head>

/*

========================================
*/

const TOTAL_QUESTIONS=20;

let score=0;

let question=0;

/*
========================================
تصادفی
========================================
*/

function randomItem(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


/*

ساخت مو
========================================
*/

        fill="${color}"/>

        <circle cx="120" cy="60" r="20"
        fill="${color}"/>

        <circle cx="145" cy="65" r="18"
        fill="${color}"/>

        <circle cx="164" cy="82" r="18"
        fill="${color}"/>
        `;

    }

    if(style==="long"){

        return `
        <path
        d="
        M72 105
        Q65 45 120 45
        Q175 45 168 105
        L160 175
        L80 175
        Z"
        fill="${color}"
        />
        `;

    }

    return `
    <path
    d="
    M76 105
    Q76 48 120 50
    Q164 48 164 105
    Q145 78 120 82
    Q95 78 76 105
    Z"
    fill="${color}"
    />
    `;

}

/*
========================================
گزینه ها
========================================
*/

function getOptions(correct){

    const options=[correct];

    while(options.length<5){

        const player=
        randomItem(players);

        if(
            !options.some(
                p=>p.name===player.name
            )
        ){

            options.push(player);

        }

    }


    return options.sort(
        ()=>Math.random()-.5
    );

}


/*
========================================
سؤال
========================================
*/

function loadQuestion(){

    answered=false;

    document.getElementById(
        "message"
    ).textContent="";

    document.getElementById(
        "next"
    ).style.display="none";


    question++;


    document.getElementById(
        "questionNumber"
    ).textContent=question;


    document.getElementById(
        "progressBar"
    ).style.width=
    (
        question/TOTAL_QUESTIONS*100
    )+"%";


    currentPlayer=
    randomItem(players);


    createPlayerImage(
        currentPlayer
    );


    const options=
    getOptions(
        currentPlayer
    );


    const box=
    document.getElementById(
        "options"
    );

    box.innerHTML="";


    options.forEach(player=>{

        const button=
        document.createElement(
            "button"
        );

        button.className="option";

        button.textContent=
        player.name;


        button.onclick=()=>{

            checkAnswer(
                button,
                player
            );

        };


        box.appendChild(button);

    });

}


/*
========================================
بررسی جواب
========================================
*/

function checkAnswer(button,player){

    if(answered)return;

    answered=true;


    const buttons=
    document.querySelectorAll(
        ".option"
    );


    buttons.forEach(btn=>{

        btn.disabled=true;


        if(
            btn.textContent===
            currentPlayer.name
        ){

            btn.classList.add(
                "correct"
            );

        }

    });


    if(
        player.name===
        currentPlayer.name
    ){

        score+=100;


        button.classList.add(
            "correct"
        );


        document.getElementById(
            "message"
        ).innerHTML=
        "✅ درست گفتی! +100 🏆";


    }else{


        button.classList.add(
            "wrong"
        );


        document.getElementById(
            "message"
        ).innerHTML=
        "❌ اشتباه! جواب: "+
        currentPlayer.name;

    }


    document.getElementById(
        "score"
    ).textContent=score;


    document.getElementById(
        "next"
    ).style.display="block";

}


/*
========================================
بعدی
========================================
*/

function nextQuestion(){

    if(
        question>=TOTAL_QUESTIONS
    ){

        finishGame();

    }else{

        loadQuestion();

    }

}


/*
========================================
پایان
========================================
*/

function finishGame(){

    document.getElementById(
        "quiz"
    ).style.display="none";


    document.getElementById(
        "result"
    ).style.display="block";


    let text;


    if(score>=1800){

        text=
        "🔥 فوق‌العاده! استاد فوتبال هستی!";

    }else if(score>=1300){

        text=
        "👏 عالی بود!";

    }else if(score>=800){

        text=
        "👍 عملکرد خوب بود!";

    }else{

        text=
        "⚽ باید بیشتر فوتبال ببینی!";

    }


    document.getElementById(
        "finalText"
    ).innerHTML=

    `
    ${text}
    <br><br>

    امتیاز نهایی:
    <strong>
    ${score}
    </strong>

    از
    ${TOTAL_QUESTIONS*100}
    `;

}


/*
========================================
شروع دوباره
========================================
*/

function restartGame(){

    score=0;

    question=0;


    document.getElementById(
        "score"
    ).textContent="0";


    document.getElementById(
        "quiz"
    ).style.display="block";


    document.getElementById(
        "result"
    ).style.display="none";


    loadQuestion();

}


/*
========================================
شروع بازی
========================================
*/

loadQuestion();
